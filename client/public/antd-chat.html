<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>三所小智 · Ant Design 聊天界面</title>
    <link rel="stylesheet" href="https://unpkg.com/antd@4.24.16/dist/antd.min.css" />
    <style>
      :root { --rail: 252px; --context: 286px; --ink: #18212f; --muted: #687386; --line: #e5e9ef; --paper: #fff; --canvas: #f4f6f8; --brand: #1677ff; }
      * { box-sizing: border-box; }
      html, body, #root { height: 100%; margin: 0; }
      body { color: var(--ink); background: var(--canvas); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
      button, input, textarea { letter-spacing: 0; }
      .app { height: 100%; display: grid; grid-template-columns: var(--rail) minmax(0, 1fr) var(--context); overflow: hidden; }
      .rail { min-width: 0; display: flex; flex-direction: column; background: #101827; color: #d6deea; border-right: 1px solid #273246; }
      .brand { height: 64px; padding: 0 18px; display: flex; align-items: center; justify-content: space-between; color: #fff; border-bottom: 1px solid #273246; }
      .brand-name { font-size: 18px; font-weight: 650; }
      .new-chat { margin: 16px; height: 40px; }
      .rail-label { padding: 6px 18px 8px; color: #8390a4; font-size: 12px; }
      .thread-list { min-height: 0; overflow: auto; padding: 0 10px; }
      .thread { width: 100%; min-height: 62px; padding: 10px 12px; color: #cbd5e1; background: transparent; border: 0; border-radius: 6px; text-align: left; cursor: pointer; transition: background-color .18s ease, color .18s ease; }
      .thread:hover { background: #1b2638; color: #fff; }
      .thread.active { background: #21324b; color: #fff; }
      .thread-title { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 14px; font-weight: 500; }
      .thread-meta { display: block; margin-top: 4px; color: #8b98aa; font-size: 12px; }
      .rail-footer { margin-top: auto; padding: 14px 16px; display: flex; align-items: center; gap: 10px; border-top: 1px solid #273246; }
      .rail-footer span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .main { min-width: 0; display: flex; flex-direction: column; background: var(--paper); }
      .topbar { height: 64px; flex: 0 0 64px; padding: 0 20px; display: flex; align-items: center; justify-content: space-between; gap: 16px; border-bottom: 1px solid var(--line); }
      .conversation-title { min-width: 0; }
      .conversation-title strong { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 15px; }
      .conversation-title span { display: block; margin-top: 2px; color: var(--muted); font-size: 12px; }
      .messages { min-height: 0; flex: 1; overflow: auto; padding: 30px max(24px, calc((100% - 790px) / 2)); scroll-behavior: smooth; }
      .message { display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 12px; margin-bottom: 28px; animation: enter .32s cubic-bezier(.2,.8,.2,1) both; }
      .message.user { grid-template-columns: minmax(0, 1fr) 34px; }
      .message.user .bubble { justify-self: end; max-width: 78%; background: #eef5ff; border-color: #d7e8ff; }
      .bubble { max-width: 720px; padding: 14px 16px; border: 1px solid var(--line); border-radius: 6px; background: #fff; line-height: 1.72; font-size: 15px; box-shadow: 0 1px 2px rgba(16, 24, 39, .03); }
      .bubble p { margin: 0 0 10px; }
      .bubble p:last-child { margin-bottom: 0; }
      .answer-title { margin-bottom: 8px; font-weight: 600; }
      .answer-list { margin: 8px 0 0; padding-left: 20px; }
      .answer-list li { margin: 5px 0; }
      .source-line { margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--line); color: var(--muted); font-size: 12px; }
      .composer-wrap { padding: 0 max(20px, calc((100% - 790px) / 2)) 20px; }
      .mode-row { margin-bottom: 8px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
      .composer { border: 1px solid #cfd6df; border-radius: 8px; background: #fff; box-shadow: 0 8px 26px rgba(20, 34, 55, .08); transition: border-color .18s ease, box-shadow .18s ease; }
      .composer:focus-within { border-color: var(--brand); box-shadow: 0 0 0 2px rgba(22, 119, 255, .12), 0 8px 26px rgba(20, 34, 55, .08); }
      .composer .ant-input { padding: 14px 14px 6px; border: 0; box-shadow: none; resize: none; font-size: 15px; }
      .composer-actions { min-height: 48px; padding: 6px 8px 8px 12px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
      .composer-note { margin-top: 8px; color: #929aaa; font-size: 12px; text-align: center; }
      .context { min-width: 0; display: flex; flex-direction: column; background: #fafbfc; border-left: 1px solid var(--line); }
      .context-head { height: 64px; padding: 0 16px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--line); font-weight: 600; }
      .context-body { min-height: 0; overflow: auto; padding: 16px; }
      .context-section { margin-bottom: 22px; }
      .context-label { margin-bottom: 9px; color: var(--muted); font-size: 12px; font-weight: 600; }
      .file-row { padding: 11px; display: flex; align-items: flex-start; gap: 10px; border: 1px solid var(--line); border-radius: 6px; background: #fff; }
      .file-icon { width: 34px; height: 34px; flex: 0 0 34px; display: grid; place-items: center; border-radius: 4px; background: #e8f3ff; color: #0958d9; font-size: 11px; font-weight: 700; }
      .file-info { min-width: 0; }
      .file-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13px; font-weight: 500; }
      .file-status { margin-top: 4px; color: #389e0d; font-size: 12px; }
      .context-list { margin: 0; padding: 0; list-style: none; }
      .context-list li { padding: 9px 0; display: flex; justify-content: space-between; gap: 12px; border-bottom: 1px solid var(--line); color: var(--muted); font-size: 13px; }
      .context-list strong { color: var(--ink); font-weight: 500; }
      .mobile-only { display: none; }
      .send-pop { animation: sendPop .28s ease; }
      @keyframes enter { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
      @keyframes sendPop { 50% { transform: scale(.95); } }
      @media (prefers-reduced-motion: reduce) { *, *::before, *::after { scroll-behavior: auto !important; animation: none !important; transition: none !important; } }
      @media (max-width: 1050px) { .app { grid-template-columns: 226px minmax(0, 1fr); } .context { display: none; } .mobile-only { display: inline-flex; } }
      @media (max-width: 720px) {
        .app { display: block; }
        .rail { display: none; }
        .main { height: 100%; }
        .topbar { height: 56px; flex-basis: 56px; padding: 0 12px; }
        .messages { padding: 20px 14px; }
        .message.user .bubble { max-width: 88%; }
        .bubble { padding: 12px 13px; font-size: 14px; }
        .composer-wrap { padding: 0 12px 12px; }
        .mode-row { align-items: flex-start; flex-direction: column; }
        .composer-actions { align-items: flex-end; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script src="https://unpkg.com/react@17.0.2/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@17.0.2/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/antd@4.24.16/dist/antd.min.js"></script>
    <script>
      (function () {
        var h = React.createElement;
        var A = antd;
        var threads = [
          ['秋游活动方案优化', '刚刚 · 深度模式'],
          ['第三季度会议纪要', '昨天 · 知识库'],
          ['年度预算数据分析', '周一 · 深度模式'],
          ['年度工作总结', '10 月 12 日 · 快速模式']
        ];

        function App() {
          var inputState = React.useState('');
          var input = inputState[0], setInput = inputState[1];
          var modeState = React.useState('deep');
          var mode = modeState[0], setMode = modeState[1];
          var sentState = React.useState([]);
          var sent = sentState[0], setSent = sentState[1];
          var sendingState = React.useState(false);
          var sending = sendingState[0], setSending = sendingState[1];
          var endRef = React.useRef(null);

          React.useEffect(function () {
            if (endRef.current) endRef.current.scrollIntoView({ behavior: 'smooth' });
          }, [sent, sending]);

          function send() {
            var value = input.trim();
            if (!value || sending) return;
            setSent(sent.concat([{ role: 'user', text: value }]));
            setInput('');
            setSending(true);
            window.setTimeout(function () {
              setSent(function (items) { return items.concat([{ role: 'assistant', text: '我已结合当前文件梳理了你的问题。这个 Ant Design 前台示例把主要操作集中在输入区，文件状态放在右侧，不打断阅读。' }]); });
              setSending(false);
              A.message.success('已生成一条示例回复');
            }, 520);
          }

          return h('div', { className: 'app' },
            h('aside', { className: 'rail' },
              h('div', { className: 'brand' }, h('span', { className: 'brand-name' }, '三所小智'), h(A.Button, { type: 'text', shape: 'circle', title: '收起侧栏', style: { color: '#aeb9c8' } }, '‹')),
              h(A.Button, { type: 'primary', className: 'new-chat' }, '＋ 新建对话'),
              h('div', { className: 'rail-label' }, '最近对话'),
              h('div', { className: 'thread-list' }, threads.map(function (item, index) { return h('button', { key: item[0], className: 'thread' + (index === 0 ? ' active' : ''), onClick: function () { A.message.info('已选择：' + item[0]); } }, h('span', { className: 'thread-title' }, item[0]), h('span', { className: 'thread-meta' }, item[1])); })),
              h('div', { className: 'rail-footer' }, h(A.Avatar, { size: 30, style: { background: '#1677ff' } }, '三'), h('span', null, '内部办公账号'))
            ),
            h('main', { className: 'main' },
              h('header', { className: 'topbar' },
                h('div', { className: 'conversation-title' }, h('strong', null, '秋游活动方案优化'), h('span', null, '已保存 · 4 条消息')),
                h(A.Space, { size: 8 }, h(A.Tag, { color: 'success' }, '文件已就绪'), h(A.Button, { className: 'mobile-only', title: '查看文件' }, '文件'), h(A.Button, { shape: 'circle', title: '更多操作' }, '···'))
              ),
              h('section', { className: 'messages' },
                h('article', { className: 'message user' }, h('div', { className: 'bubble' }, '请根据我上传的策划书，检查活动安排有没有明显问题，并给出修改建议。'), h(A.Avatar, { size: 34, style: { background: '#3b82f6' } }, '我')),
                h('article', { className: 'message' }, h(A.Avatar, { size: 34, style: { background: '#0f766e' } }, '智'), h('div', { className: 'bubble' }, h('div', { className: 'answer-title' }, '整体方案可执行，但有 3 处需要优先调整'), h('p', null, '我核对了行程、人员分组和预算安排，主要风险集中在集合时间、雨天预案和费用口径。'), h('ol', { className: 'answer-list' }, h('li', null, '集合与发车只间隔 10 分钟，建议至少预留 25 分钟。'), h('li', null, '雨天方案只有原则说明，缺少替代场地和触发条件。'), h('li', null, '餐费按 48 人计算，但报名表目前是 52 人，预算需要统一。')), h('div', { className: 'source-line' }, '依据：工会秋游策划书_修改版.docx · 第 2、4、7 节'))),
                sent.map(function (item, index) { return item.role === 'user' ? h('article', { className: 'message user', key: index }, h('div', { className: 'bubble' }, item.text), h(A.Avatar, { size: 34, style: { background: '#3b82f6' } }, '我')) : h('article', { className: 'message', key: index }, h(A.Avatar, { size: 34, style: { background: '#0f766e' } }, '智'), h('div', { className: 'bubble' }, item.text)); }),
                sending ? h('article', { className: 'message' }, h(A.Avatar, { size: 34, style: { background: '#0f766e' } }, '智'), h('div', { className: 'bubble' }, h(A.Space, null, h(A.Spin, { size: 'small' }), '正在整理回复'))) : null,
                h('div', { ref: endRef })
              ),
              h('div', { className: 'composer-wrap' },
                h('div', { className: 'mode-row' }, h(A.Radio.Group, { value: mode, buttonStyle: 'solid', onChange: function (e) { setMode(e.target.value); } }, h(A.Radio.Button, { value: 'fast' }, '快速'), h(A.Radio.Button, { value: 'deep' }, '深度'), h(A.Radio.Button, { value: 'knowledge' }, '知识库')), h(A.Tag, null, mode === 'deep' ? '支持文件处理' : mode === 'knowledge' ? '基于内部知识库' : '文字问答')),
                h('div', { className: 'composer' }, h(A.Input.TextArea, { value: input, onChange: function (e) { setInput(e.target.value); }, onPressEnter: function (e) { if (!e.shiftKey) { e.preventDefault(); send(); } }, autoSize: { minRows: 2, maxRows: 6 }, placeholder: '继续提问，或添加文件…' }), h('div', { className: 'composer-actions' }, h(A.Space, null, h(A.Button, { title: '添加文件' }, '＋ 文件'), h(A.Button, { title: '开启记忆' }, '记忆')), h(A.Button, { type: 'primary', disabled: !input.trim(), loading: sending, onClick: send }, '发送'))),
                h('div', { className: 'composer-note' }, 'AI 生成内容可能有误，重要信息请结合原文件确认')
              )
            ),
            h('aside', { className: 'context' },
              h('div', { className: 'context-head' }, h('span', null, '当前上下文'), h(A.Button, { type: 'text', shape: 'circle', title: '关闭面板' }, '×')),
              h('div', { className: 'context-body' },
                h('section', { className: 'context-section' }, h('div', { className: 'context-label' }, '本轮文件'), h('div', { className: 'file-row' }, h('div', { className: 'file-icon' }, 'DOCX'), h('div', { className: 'file-info' }, h('div', { className: 'file-name', title: '工会秋游策划书_修改版.docx' }, '工会秋游策划书_修改版.docx'), h('div', { className: 'file-status' }, '✓ 解析完成 · 2.4 MB')))),
                h('section', { className: 'context-section' }, h('div', { className: 'context-label' }, '回答设置'), h('ul', { className: 'context-list' }, h('li', null, h('span', null, '回答模式'), h('strong', null, '深度')), h('li', null, h('span', null, '记忆'), h('strong', null, '手动')), h('li', null, h('span', null, '引用来源'), h('strong', null, '开启')))),
                h(A.Alert, { type: 'info', showIcon: true, message: '文件只在当前会话中使用', description: '切换到其他会话后，不会自动带入此文件。' })
              )
            )
          );
        }

        ReactDOM.render(h(App), document.getElementById('root'));
      })();
    </script>
  </body>
</html>

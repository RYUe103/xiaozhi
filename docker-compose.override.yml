services:
  keycloak:
    container_name: sansuo-keycloak
    image: quay.io/keycloak/keycloak:26.0.7
    restart: unless-stopped
    command:
      - start-dev
      - --import-realm
      - --http-enabled=true
      - --hostname=http://keycloak.localhost:8081
      - --hostname-strict=false
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin123
    ports:
      - "127.0.0.1:8081:8080"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "timeout 5 bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080 && printf \"GET /realms/sansuo/.well-known/openid-configuration HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n\" >&3 && grep -q \"HTTP/1.1 200\" <&3'",
        ]
      interval: 10s
      timeout: 6s
      retries: 12
      start_period: 20s
    volumes:
      - ./keycloak/import:/opt/keycloak/data/import
      - keycloak_data:/opt/keycloak/data

  api:
    image: ${SANSUO_PDF_IMAGE:-sansuo/librechat-current-local:20261031}
    platform: linux/amd64
    depends_on:
      mongodb:
        condition: service_started
      rag_api:
        condition: service_started
      keycloak:
        condition: service_healthy
    extra_hosts:
      - "keycloak.localhost:host-gateway"
    env_file:
      - .env
    environment:
      SANSUO_KNOWLEDGE_BASE_URL: http://host.docker.internal:8765
      SANSUO_PDF_RENDER_PYTHON: /opt/sansuo-pdf-venv/bin/python
      SANSUO_JIT_TRACE: "${SANSUO_JIT_TRACE:-true}"
    volumes:
      - type: bind
        source: ./librechat.yaml
        target: /app/librechat.yaml
      - type: bind
        source: ./api/models/everosMemory.js
        target: /app/api/models/everosMemory.js
      - type: bind
        source: ./api/models/memoryGateway.js
        target: /app/api/models/memoryGateway.js
      - type: bind
